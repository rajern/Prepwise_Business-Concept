[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prepwise-api"
version = "0.1.0"
description = "FastAPI backend for Prepwise."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2.0",
    "azure-monitor-opentelemetry>=1.8,<2.0",
    "fastapi>=0.115,<1.0",
    "openai>=2.0,<3.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.60b0,<1.0",
    "pgvector>=0.4,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pyjwt[crypto]>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
prepwise-seed = "prepwise_api.seed:main"
prepwise-seed-if-empty = "prepwise_api.seed:main_if_empty"
prepwise-set-user-role = "prepwise_api.user_roles:main"
prepwise-index-knowledge = "prepwise_api.knowledge:main"
prepwise-retrieve-knowledge = "prepwise_api.knowledge:retrieve_main"

[project.optional-dependencies]
dev = [
    "httpx2>=2.0,<3.0",
    "mypy>=1.15,<2.0",
    "pytest>=8.3,<10.0",
    "ruff>=0.11,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
