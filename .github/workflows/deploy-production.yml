name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  ci:
    name: Required CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to production
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      AZURE_CONTAINER_APP: ca-prepwise-prod
      KEY_VAULT_NAME: kv-prepwise-prod-f5knfy
      AZURE_STATIC_WEB_APP: swa-prepwise-prod-f5knfy
      BACKEND_IMAGE: ghcr.io/rajern/prepwise-api:${{ github.sha }}
      BACKEND_IMAGE_LATEST: ghcr.io/rajern/prepwise-api:latest
      ENTRA_TENANT_ID: 1a782388-bf90-4ea8-af8f-bcc755f5cd7e
      ENTRA_TENANT_SUBDOMAIN: prepwisecustomers
      ENTRA_API_CLIENT_ID: 82773ea0-fcf3-4874-81c3-3cd0da7d00c7
      ENTRA_API_DELEGATED_SCOPE: access_as_user

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$BACKEND_IMAGE" \
            --tag "$BACKEND_IMAGE_LATEST" \
            ./backend
          docker push "$BACKEND_IMAGE"
          docker push "$BACKEND_IMAGE_LATEST"

      - name: Verify backend image is publicly pullable
        run: |
          docker logout ghcr.io
          for attempt in {1..6}; do
            echo "Checking anonymous GHCR access (attempt $attempt of 6)."
            if docker manifest inspect "$BACKEND_IMAGE" > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The GHCR package is not publicly pullable by Azure Container Apps."
          exit 1

      - name: Apply Neon migrations and initialise an empty catalogue
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          database_url="$(az keyvault secret show \
            --vault-name "$KEY_VAULT_NAME" \
            --name database-migration-url \
            --query value \
            --output tsv)"
          if [ -z "$database_url" ]; then
            echo "::error::database-migration-url is empty or unavailable."
            exit 1
          fi
          echo "::add-mask::$database_url"
          docker run --rm \
            --env APP_ENV=production \
            --env DATABASE_URL="$database_url" \
            "$BACKEND_IMAGE" \
            python -m alembic upgrade head
          docker run --rm \
            --env APP_ENV=production \
            --env DATABASE_URL="$database_url" \
            "$BACKEND_IMAGE" \
            prepwise-seed-if-empty
          unset database_url

      - name: Deploy backend to Azure Container Apps
        id: backend
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          az containerapp ingress update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --target-port 8000 \
            --output none
          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --image "$BACKEND_IMAGE" \
            --set-env-vars \
              "LOG_LEVEL=INFO" \
              "OTEL_SERVICE_NAME=prepwise-api" \
              "ENTRA_TENANT_ID=$ENTRA_TENANT_ID" \
              "ENTRA_TENANT_SUBDOMAIN=$ENTRA_TENANT_SUBDOMAIN" \
              "ENTRA_API_CLIENT_ID=$ENTRA_API_CLIENT_ID" \
              "ENTRA_API_SCOPE=$ENTRA_API_DELEGATED_SCOPE" \
              "OPENAI_MODEL=gpt-5.6-terra" \
              "OPENAI_REASONING_EFFORT=low" \
              "OPENAI_TIMEOUT_SECONDS=30" \
            --output none
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --query properties.template \
            --output json > "$RUNNER_TEMP/container-app-template.json"
          jq '
            del(.revisionSuffix)
            | walk(
                if type == "object" then
                  with_entries(select(.value != null))
                else
                  .
                end
              )
            | .containers[0].env |= map(
                if has("secretRef") then del(.value) else . end
              )
            | .containers[0].probes = [
                {
                  "type": "Liveness",
                  "httpGet": {"path": "/health/live", "port": 8000},
                  "initialDelaySeconds": 5,
                  "periodSeconds": 15,
                  "timeoutSeconds": 3,
                  "failureThreshold": 3,
                  "successThreshold": 1
                },
                {
                  "type": "Readiness",
                  "httpGet": {"path": "/health/ready", "port": 8000},
                  "initialDelaySeconds": 5,
                  "periodSeconds": 10,
                  "timeoutSeconds": 5,
                  "failureThreshold": 3,
                  "successThreshold": 1
                }
              ]
            | {"properties": {"template": .}}
          ' "$RUNNER_TEMP/container-app-template.json" \
            > "$RUNNER_TEMP/container-app-probes.json"
          container_app_id="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --query id \
            --output tsv)"
          az rest \
            --method patch \
            --uri "https://management.azure.com${container_app_id}?api-version=2025-01-01" \
            --headers "Content-Type=application/json" \
            --body "@$RUNNER_TEMP/container-app-probes.json" \
            --output none
          backend_fqdn="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"
          backend_url="https://$backend_fqdn"
          echo "url=$backend_url" >> "$GITHUB_OUTPUT"

      - name: Verify backend and Neon
        env:
          BACKEND_URL: ${{ steps.backend.outputs.url }}
        run: |
          curl --fail --silent --show-error \
            --retry 18 --retry-delay 5 --retry-all-errors \
            --output /dev/null "$BACKEND_URL/health/live"
          curl --fail --silent --show-error \
            --retry 6 --retry-delay 5 --retry-all-errors \
            --output /dev/null "$BACKEND_URL/health/ready"
          curl --fail --silent --show-error \
            --retry 6 --retry-delay 5 --retry-all-errors \
            --output /dev/null "$BACKEND_URL/api/meals"

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 11.19.0
          runtime: node@22
          working-directory: frontend
          cache: true
          install: false

      - name: Build frontend for the deployed API
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ steps.backend.outputs.url }}
          VITE_ENTRA_TENANT_ID: ${{ vars.ENTRA_EXTERNAL_TENANT_ID }}
          VITE_ENTRA_TENANT_SUBDOMAIN: ${{ vars.ENTRA_EXTERNAL_TENANT_SUBDOMAIN }}
          VITE_ENTRA_SPA_CLIENT_ID: ${{ vars.ENTRA_SPA_CLIENT_ID }}
          VITE_ENTRA_API_SCOPE: ${{ vars.ENTRA_API_SCOPE }}
        run: |
          if [ -z "$VITE_ENTRA_TENANT_ID" ] || \
             [ -z "$VITE_ENTRA_TENANT_SUBDOMAIN" ] || \
             [ -z "$VITE_ENTRA_SPA_CLIENT_ID" ] || \
             [ -z "$VITE_ENTRA_API_SCOPE" ]; then
            echo "::error::One or more required Entra frontend variables are unavailable."
            exit 1
          fi
          pnpm install --frozen-lockfile
          pnpm build
          grep --recursive --fixed-strings "$VITE_API_BASE_URL" dist/assets > /dev/null
          grep --recursive --fixed-strings "$VITE_ENTRA_TENANT_ID" dist/assets > /dev/null
          grep --recursive --fixed-strings "$VITE_ENTRA_TENANT_SUBDOMAIN" dist/assets > /dev/null
          grep --recursive --fixed-strings "$VITE_ENTRA_SPA_CLIENT_ID" dist/assets > /dev/null
          grep --recursive --fixed-strings "$VITE_ENTRA_API_SCOPE" dist/assets > /dev/null

      - name: Read Static Web Apps deployment token through OIDC
        id: static-web-app-token
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          deployment_token="$(az staticwebapp secrets list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_STATIC_WEB_APP" \
            --query properties.apiKey \
            --output tsv)"
          if [ -z "$deployment_token" ]; then
            echo "::error::Static Web Apps deployment token is unavailable."
            exit 1
          fi
          echo "::add-mask::$deployment_token"
          echo "token=$deployment_token" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.static-web-app-token.outputs.token }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true

      - name: Run production smoke tests
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          BACKEND_URL: ${{ steps.backend.outputs.url }}
        run: |
          frontend_hostname="$(az staticwebapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_STATIC_WEB_APP" \
            --query defaultHostname \
            --output tsv)"
          frontend_url="https://$frontend_hostname"
          bash scripts/smoke-production.sh "$frontend_url" "$BACKEND_URL"
          {
            echo "### Production deployment"
            echo "- Frontend: $frontend_url"
            echo "- Backend: $BACKEND_URL"
            echo "- Image: $BACKEND_IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"
