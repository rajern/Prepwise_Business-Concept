services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-prepwise}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-prepwise}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-1a782388-bf90-4ea8-af8f-bcc755f5cd7e}
      ENTRA_TENANT_SUBDOMAIN: ${ENTRA_TENANT_SUBDOMAIN:-prepwisecustomers}
      ENTRA_API_CLIENT_ID: ${ENTRA_API_CLIENT_ID:-82773ea0-fcf3-4874-81c3-3cd0da7d00c7}
      ENTRA_API_SCOPE: ${ENTRA_API_SCOPE:-access_as_user}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prepwise}
      POSTGRES_USER: ${POSTGRES_USER:-prepwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
